# Meson cross file for MINIX 3 / amd64.
#
# The -D__minix defines are not decoration: <sys/errno.h> only defines _SIGN
# when __minix is set, and every errno constant is spelled (_SIGN nn), so
# without them the C library headers do not parse.
#
# system = 'minix' (not 'netbsd') on purpose.  GLib picks its file-monitor
# backend by probing for functions rather than by OS name, so MINIX -- which
# has neither inotify nor kqueue -- correctly falls back to polling.  Claiming
# to be NetBSD would not change that, but it would make other BSD-only
# assumptions elsewhere in the tree fire.

[binaries]
c          = '/home/david/Documentos/Code/build/tooldir.Linux-x86_64/bin/x86_64-elf64-minix-clang'
cpp        = '/home/david/Documentos/Code/build/tooldir.Linux-x86_64/bin/x86_64-elf64-minix-clang++'
ar         = '/home/david/Documentos/Code/build/tooldir.Linux-x86_64/bin/x86_64-elf64-minix-ar'
strip      = '/home/david/Documentos/Code/build/tooldir.Linux-x86_64/bin/x86_64-elf64-minix-strip'
pkg-config = 'pkg-config'

# --sysroot has to be passed to the compiler by hand.  Meson's sys_root property
# below only feeds pkg-config; unlike CMake's CMAKE_SYSROOT it never reaches the
# command line, so without this even <stddef.h> is not found and every probe --
# down to sizeof(char) -- fails.
[built-in options]
c_args        = ['-D__minix=3', '-D__minix__=3', '-D__ELF__=1', '-D_NETBSD_SOURCE', '--sysroot=/home/david/Documentos/Code/build/destdir.amd64']
cpp_args      = ['-D__minix=3', '-D__minix__=3', '-D__ELF__=1', '-D_NETBSD_SOURCE', '--sysroot=/home/david/Documentos/Code/build/destdir.amd64']
c_link_args   = ['--sysroot=/home/david/Documentos/Code/build/destdir.amd64']
cpp_link_args = ['--sysroot=/home/david/Documentos/Code/build/destdir.amd64']
prefix        = '/usr'

[properties]
sys_root           = '/home/david/Documentos/Code/build/destdir.amd64'
pkg_config_libdir  = '/home/david/Documentos/Code/build/destdir.amd64/usr/lib/pkgconfig'
# MINIX links statically; a dynamically linked Qt segfaults before main() in
# dynamic TLS, and the rest of the desktop stack follows Qt.
needs_exe_wrapper  = true

[host_machine]
system     = 'minix'
cpu_family = 'x86_64'
cpu        = 'x86_64'
endian     = 'little'
