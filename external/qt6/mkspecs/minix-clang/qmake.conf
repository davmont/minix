#
# qmake configuration for minix-clang
#
# MINIX 3: a NetBSD userland on a microkernel, built with clang.  The BSD common
# configuration is the right base -- MINIX has the BSD socket, dirent and
# arc4random semantics -- but MINIX is deliberately NOT netbsd here: it has no
# kqueue (kevent and kqueue are both in libc's MISSING_SYSCALLS), so it must not
# be taken for a platform that does.
#

MAKEFILE_GENERATOR      = UNIX
QMAKE_PLATFORM          = minix

include(../common/bsd/bsd.conf)

QMAKE_LFLAGS_NOUNDEF    = -Wl,--no-undefined

include(../common/gcc-base-unix.conf)
include(../common/clang.conf)
load(qt_config)
