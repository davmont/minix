# $MINIX$
#
# GRUB configuration for the MINIX 3 / Atomix hybrid (BIOS + UEFI) CD.
#
# This file is consumed by GRUB when the CD is booted in UEFI mode through
# the EFI El Torito boot-catalog entry (platform id 0xEF).  GRUB is loaded
# from the EFI System Partition image embedded in the ISO; it then reads the
# kernel and boot modules from the ISO-9660 volume itself.
#
# Design note / attribution:
#   The UEFI-on-MINIX boot flow implemented here follows the approach
#   pioneered by Naoaki Nonaka (nnonaka) in his public "uefiboot" MINIX
#   branch <https://github.com/nnonaka/minix>: rather than maintaining a
#   bespoke .efi application, an existing multiboot-capable EFI loader
#   (GRUB) chainloads the MINIX microkernel.  The EFI El Torito support in
#   makefs (usr.sbin/makefs/cd9660/cd9660_eltorito.[ch]) that makes the
#   hybrid catalog possible is likewise nonaka's upstream NetBSD work and is
#   already present in this tree.  Attribution retained per project policy.
#
# The menu entries below intentionally mirror the BIOS boot.cfg generated by
# releasetools/amd64_cdimage.sh so that BIOS and UEFI boots behave alike.

set timeout=10
set default=0

# Locate the ISO-9660 volume that carries the kernel and modules.  In El
# Torito UEFI mode GRUB's $root initially points at the small ESP image, so
# we search for a file we know lives on the main volume and switch to it.
search --no-floppy --file --set=root /boot/minix_default/kernel

# load_minix <kernel-cmdline>
#   Boots the MINIX microkernel via the Multiboot2 protocol and loads the
#   userland boot modules in the canonical order.  Multiboot2 (rather than v1)
#   is required under UEFI: it hands the kernel the ACPI RSDP (so SMP/APIC
#   bring-up works without the legacy BIOS scan) and a linear framebuffer.  The
#   kernel carries a .multiboot2 header alongside the v1 header in
#   minix/kernel/arch/x86_64/head.S; both must sit within the first 8 KB of the
#   kernel file, which the kernel link enforces via -Wl,-z,max-page-size=0x1000.
#   See minix/kernel/arch/x86_64/pre_init.c and docs/UEFI_BOOT.md.
function load_minix {
    multiboot2 /boot/minix_default/kernel $1
    module2    /boot/minix_default/mod01_ds      ds
    module2    /boot/minix_default/mod02_rs      rs
    module2    /boot/minix_default/mod03_pm      pm
    module2    /boot/minix_default/mod04_sched   sched
    module2    /boot/minix_default/mod05_vfs     vfs
    module2    /boot/minix_default/mod06_memory  memory
    module2    /boot/minix_default/mod07_tty     tty
    module2    /boot/minix_default/mod08_mib     mib
    module2    /boot/minix_default/mod09_vm      vm
    module2    /boot/minix_default/mod10_pfs     pfs
    module2    /boot/minix_default/mod11_mfs     mfs
    module2    /boot/minix_default/mod12_init    init
}

# The storage controller (AHCI/SATA vs legacy IDE) is auto-detected at boot by
# the ramdisk rc via /proc/pci, so a single entry works on both q35-class
# (AHCI) and i440fx-class (IDE) machines.  To force a choice when debugging,
# press 'e' to edit the entry and add ahci=yes or ahci=no to the kernel line.
menuentry "Regular MINIX 3 (UEFI)" {
    load_minix "bootcd=1 cdproberoot=1 no_apic=0 acpi=1"
}

menuentry "MINIX 3 (UEFI, serial console)" {
    load_minix "bootcd=1 cdproberoot=1 no_apic=0 acpi=1 console=tty00"
}

menuentry "MINIX 3 (UEFI, serial console, verbose)" {
    load_minix "bootcd=1 cdproberoot=1 no_apic=0 acpi=1 console=tty00 verbose=3"
}
